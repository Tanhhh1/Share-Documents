services:
  redis:
    image: redis:latest
    container_name: redis

  gotenberg:
    image:  gotenberg/gotenberg:latest
    container_name: gotenberg

  backend:
    build: ./API-ShareDocuments
    container_name: sharedocs-backend
    ports:
      - "1107:1107"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:1107
      - Database__Main=Host=host.docker.internal;Port=5432;Database=share_docs_db;Username=postgres;Password=${DB_PASSWORD};Include Error Detail=true
      - RedisSettings__ConnectionString=redis:6379
      - Gotenberg__BaseUrl=http://gotenberg:3000
      - ServerSetting__CurrentDomain=http://localhost:1107
      - ServerSetting__WithOrigins__0=http://localhost:8080
      - Supabase__SecretKey=${SUPABASE_SECRET_KEY}
      - EmailSettings__SenderPassword=${EMAIL_SENDER_PASSWORD}
      - PayOSSettings__ApiKey=${PAYOS_API_KEY}
      - PayOSSettings__ChecksumKey=${PAYOS_CHECKSUM_KEY}
      - PayOSSettings__ReturnUrl=http://localhost:8080/membership
      - PayOSSettings__CancelUrl=http://localhost:8080/membership
      - JwtConfiguration__SecretKey=${JWT_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - gotenberg

  frontend:
    build:
      context: ./UI-ShareDocuments
      args:
        VITE_API_URL: http://localhost:1107/api/v1
        VITE_HUB_URL: http://localhost:1107
    container_name: sharedocs-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend